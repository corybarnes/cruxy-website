<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cruxy — High-conversion engines for Shopify & Klaviyo</title>
<meta name="description" content="E-commerce engineering for the next generation of D2C leaders. Shopify Plus & Klaviyo Elite Partners.">
<link rel="icon" type="image/svg+xml" href="images/cruxy-mark-color.svg">
<link rel="icon" type="image/png" href="images/cruxy-mark-color.png">
<link rel="apple-touch-icon" href="images/cruxy-mark-color.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

<nav class="nav">
  <a href="index.html" class="logo">
    <img src="images/cruxy-logo-color.svg" alt="Cruxy" class="logo-img">
  </a>
  <div class="nav-links">
    <a href="solutions.html">Solutions</a>
    <a href="case-studies.html">Case Studies</a>
    <a href="about.html">About</a>
  </div>
  <a href="#" class="btn btn-yellow">Contact Us</a>
</nav>

<header class="hero">
  <span class="badge" id="hero-badge"></span>
  <h1 id="hero-headline"></h1>
  <p class="lead" id="hero-lead"></p>
  <div class="hero-cta-row">
    <a href="#" class="btn btn-primary"><span id="hero-cta-label"></span></a>
    <div class="trust-marks" id="trust-marks"></div>
  </div>
</header>

<section class="stats-bar">
  <div class="wrap" id="stats-bar"></div>
</section>

<section class="section">
  <div class="section-head">
    <h2 id="spec-heading"></h2>
    <p id="spec-lead"></p>
  </div>
  <div class="card-grid" id="spec-grid"></div>
</section>

<section class="section alt">
  <div class="split">
    <div class="split-media">
      <img id="feature-img" alt="Client storefront preview">
      <div class="media-badge">
        <div class="stat-num" id="feature-stat-num"></div>
        <div class="stat-label" id="feature-stat-label"></div>
      </div>
    </div>
    <div class="split-copy">
      <h3 id="feature-heading"></h3>
      <p id="feature-body"></p>
      <a href="case-studies.html" class="link-arrow" id="feature-link"></a>
    </div>
  </div>
</section>

<section class="section">
  <div class="testimonial">
    <div class="stars">★★★★★</div>
    <blockquote id="testimonial-quote"></blockquote>
    <div class="who">
      <div class="avatar"></div>
      <div class="name" id="testimonial-name"></div>
      <div class="role" id="testimonial-role"></div>
    </div>
  </div>
</section>

<div class="cta-banner">
  <div class="cta-banner-inner">
    <h2 id="cta-heading"></h2>
    <p id="cta-body"></p>
    <div class="cta-btn-row">
      <a href="#" class="btn btn-primary" id="cta-primary"></a>
      <a href="case-studies.html" class="btn btn-dark" id="cta-secondary"></a>
    </div>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="footer-about">
      <a href="index.html" class="logo">
        <img src="images/cruxy-logo-color.svg" alt="Cruxy" class="logo-img">
      </a>
      <p>E-commerce engineering for the next generation of D2C leaders. Shopify Plus & Klaviyo Elite Partners.</p>
    </div>
    <div class="footer-cols">
      <div class="footer-col">
        <h4>Agency</h4>
        <a href="case-studies.html">Case Studies</a>
        <a href="solutions.html">Solutions</a>
        <a href="about.html">About</a>
      </div>
      <div class="footer-col">
        <h4>Contact</h4>
        <a href="#">New Business</a>
        <a href="#">Twitter / X</a>
        <a href="#">LinkedIn</a>
      </div>
    </div>
  </div>
  <div class="footer-bottom">
    <span>© 2026 Cruxy. All rights reserved.</span>
  </div>
</footer>

<script src="js/site.js"></script>
</body>
</html>
